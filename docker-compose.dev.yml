services:
  nginx:
    image: nginx:1.25-alpine
    container_name: moviespot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - moviespot-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moviespot-backend
    env_file:
      - .env.dev
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: on-failure
    networks:
      - moviespot-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: moviespot-frontend
    env_file:
      - .env.dev
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - moviespot-net

  db:
    image: mysql:8.0
    container_name: moviespot-mysql
    env_file:
      - .env.dev
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: on-failure
    networks:
      - moviespot-net

networks:
  moviespot-net:

volumes:
  db_data:
